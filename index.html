<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpsLens</title>
<meta name="description" content="OpsLens: animated, interactive lessons on Git, Docker, Kubernetes, AWS EC2 and S3, scaling and CI/CD, plus an on-call incident game.">
<meta name="theme-color" content="#060c13">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="brand">
      <svg width="42" height="42" viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="40" height="40" rx="10" fill="#0c1a24" stroke="#2fe8c4" stroke-width="2.4"/><rect x="7" y="8" width="24" height="7" rx="2.2" fill="#16313c" stroke="#bff3ea" stroke-width="1.8"/><rect x="7" y="17.5" width="24" height="7" rx="2.2" fill="#16313c" stroke="#bff3ea" stroke-width="1.8"/><rect x="7" y="27" width="24" height="7" rx="2.2" fill="#16313c" stroke="#bff3ea" stroke-width="1.8"/><circle cx="11.5" cy="11.5" r="1.5" fill="#2fe8a0"/><circle cx="11.5" cy="21" r="1.5" fill="#2fe8a0"/><circle cx="11.5" cy="30.5" r="1.5" fill="#ffa24a"/><path d="M34.2 34.2l5 5" stroke="#bff3ea" stroke-width="3.6" stroke-linecap="round"/><circle cx="28.5" cy="28.5" r="8.6" fill="#0f3550" fill-opacity=".95" stroke="#bff3ea" stroke-width="2.6"/><circle cx="28.5" cy="28.5" r="3.4" fill="#ffa24a" stroke="#071118" stroke-width="1.2"/></svg>
      <span>Ops<b>Lens</b></span><em class="tag">DevOps command center</em>
    </div>
    <div class="hd-r"><span id="clock" aria-label="Local date and time"></span><span class="who" id="who"></span></div>
    <nav class="lessons" id="lessons" aria-label="Lessons"></nav>
  </header>

  <section class="kpis" id="kpis" aria-label="Your study numbers"></section>
  <nav class="crumb" id="crumb" aria-label="Where you are"></nav>
  <section id="home" aria-label="Study sections"></section>
  <section id="awsHub" aria-label="AWS services"></section>
  <section id="svcPage" aria-label="AWS service guide"></section>

  <div class="deck">
    <div class="mainc">
      <p class="intro" id="intro"></p>
      <div class="metrics" id="metrics" aria-live="polite"></div>

      <section class="stage" id="stagePanel" aria-label="Animated diagram">
        <div class="svgwrap"><svg id="svg" viewBox="0 0 640 380" role="img" aria-label="Diagram for the current step"></svg></div>
        <div class="stagebar">
          <ul class="legend" id="legend"></ul>
          <div class="tools">
            <button class="icon" id="replay" type="button" aria-label="Replay animation" title="Replay animation"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
          </div>
        </div>
      </section>

      <section class="steps" id="stepsPanel" aria-label="Steps in this lesson">
        <h3 class="ph">In this lesson</h3>
        <ol id="stepper"></ol>
      </section>

      <section class="card" id="card"></section>
      <section id="game" class="game" aria-label="Incident Room game"></section>
    </div>

    <aside class="side" aria-label="Progress and components">
      <section class="panel" id="progPanel"><h3 class="ph">Lesson progress <small>steps visited</small></h3><div id="progTop"></div><ul class="prog" id="progList"></ul></section>
      <section class="panel parts" id="partsPanel" aria-label="Components in this lesson"><h3 class="ph">What you are looking at</h3><ul id="partsList"></ul></section>
    </aside>
  </div>

  <section class="bottom" id="bottom" aria-label="Study summary"></section>
  <footer>Use the left and right arrow keys to move between steps. Progress, activity and scores are saved in this browser only.</footer>
</div>

<script src="/app.js" defer></script>
</body>
</html>
